# Probe 8: which decoder for a compressed HTTP response (docs/PERFORMANCE.md, item 3).
# A package of its own, not a bin of the spike: each decoder sits behind a feature so that each can
# be built alone, and its build time, peak memory and binary size measured without DuckDB's.
[package]
name = "probe8_decompress"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[features]
ruzstd = ["dep:ruzstd"]
czstd = ["dep:zstd"]
lz4 = ["dep:lz4_flex"]
gz-miniz = ["dep:flate2", "flate2/rust_backend"]
gz-zlibrs = ["dep:flate2", "flate2/zlib-rs"]
arrow = ["dep:arrow", "dep:arrow-ipc"]

[dependencies]
ruzstd = { version = "=0.9.0", default-features = false, features = ["std"], optional = true }
zstd = { version = "0.13", default-features = false, optional = true }
lz4_flex = { version = "0.13", default-features = false, features = ["std", "frame"], optional = true }
flate2 = { version = "1.1", default-features = false, optional = true }
arrow = { version = "58.4", default-features = false, features = ["ipc"], optional = true }
arrow-ipc = { version = "58.4", default-features = false, features = ["lz4"], optional = true }

[profile.release]
strip = true
