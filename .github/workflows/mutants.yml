name: Mutants

# A test is evidence only if it fails when the thing it guards is removed. cargo-mutants removes
# things — replaces a function body, flips a comparison — and reports each change the suite did
# not notice. Every mutant runs the whole suite, so this is weekly and on demand, not per push,
# and it covers the modules the containment rests on.
#
# A gate: any mutant the suite misses (exit 2) or that hangs it (exit 3) fails the run. What is
# mutated, and the few mutants no test can tell apart from the original, each with the reason,
# are in .cargo/mutants.toml. A survivor is fixed by writing the test that should have caught
# it; `mutants.out` is uploaded either way to say which.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-12
        with: { toolchain: "1.98.1" }
      # Pinned: a new release can generate new mutants, and a gate should move when we move it.
      - uses: taiki-e/install-action@dfae9bf3d6f6c6f20ef4ebb3486c01a51341ff12 # v2.87.18
        with:
          tool: cargo-mutants@27.1.0
      - name: Mutate what the containment rests on
        run: cargo mutants --no-shuffle --shard ${{ matrix.shard }}/4 --timeout 600
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out
