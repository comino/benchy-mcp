name: Release

# A `v*` tag builds, smoke-tests and publishes a release. `workflow_dispatch`, and a pull request
# that touches packaging, run the same build and smoke test as a dry run: the bundles are kept as
# workflow artifacts and nothing is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - Dockerfile
      - .dockerignore
      - Cargo.toml
      - Cargo.lock
      - packaging/**
      - rust-toolchain.toml
      - install.sh
      - build.rs
      - .cargo/config.toml

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest Ubuntu runner so the binary needs no newer glibc than 2.35;
          # DuckDB's own library asks for 2.25.
          - { platform: linux-x86_64, runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { platform: macos-arm64, runner: macos-14, target: aarch64-apple-darwin }
          # Cross-built on Apple silicon: DuckDB's macOS library is universal, and an Intel
          # runner costs more and builds slower. It is run on Intel in the smoke test.
          - { platform: macos-x86_64, runner: macos-14, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Only $ORIGIN / @executable_path in the rpath: the library ships beside the binary.
      BENCHY_BUNDLE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable branch, 2026-09-12
        with: { toolchain: "1.98.1", targets: "${{ matrix.target }}" }
      # No build cache: a release is built the way a stranger's first build is, from nothing,
      # except that DuckDB's release file is fetched first and checked against
      # packaging/duckdb.sha256, so libduckdb-sys reuses it instead of downloading it unchecked.
      # package.sh checks the library again before it goes into the bundle.
      - run: python3 packaging/duckdb_lib.py fetch ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: packaging/package.sh ${{ matrix.target }} ${{ matrix.platform }} dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchy-mcp-${{ matrix.platform }}
          retention-days: 7
          path: |
            dist/benchy-mcp-${{ matrix.platform }}.tar.gz
            dist/benchy-mcp-${{ matrix.platform }}.tar.gz.sha256
            dist/benchy-mcp-${{ matrix.platform }}.cdx.json
          if-no-files-found: error

  # compat.json, written once from every bundle: what this machine's binary says of itself
  # (`--version --json`), and the oldest glibc any Linux bundle needs, read from the ELF files'
  # version needs, which no binary can say of itself. Refused unless the bundles are exactly the
  # platforms the binary names. In a job of its own, so that the release job runs nothing built.
  compat:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchy-mcp-*
          merge-multiple: true
          path: dist
      - run: |
          mkdir compat
          python3 packaging/compat.py write dist > compat/compat.json
          cat compat/compat.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchy-compat
          retention-days: 7
          path: compat/compat.json
          if-no-files-found: error

  # Each bundle on a runner that never built anything: no target/, no Rust, no DuckDB elsewhere.
  # Linux on the oldest and the newest Ubuntu; macOS on a newer release than it was built on.
  # Each also checks its binary against compat.json, which only one platform's binary wrote.
  smoke:
    needs: [build, compat]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-22.04-arm }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: macos-x86_64, runner: macos-15-intel }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchy-mcp-${{ matrix.platform }}
          path: ${{ runner.temp }}/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchy-compat
          path: ${{ runner.temp }}/compat
      - run: packaging/smoke.sh "$RUNNER_TEMP/dist" ${{ matrix.platform }} "$RUNNER_TEMP/compat/compat.json"

  containers:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux-x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, platform: linux-aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchy-mcp-${{ matrix.platform }}
          path: dist
      - name: Build an image from the release bundle
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          (cd dist && sha256sum -c "benchy-mcp-$PLATFORM.tar.gz.sha256")
          mkdir bundle
          tar -xzf "dist/benchy-mcp-$PLATFORM.tar.gz" --strip-components=1 -C bundle
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          docker buildx build --load --target release --file Dockerfile \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "benchy-mcp:linux-$ARCH" bundle
      - name: Exercise the image with the default Docker seccomp profile
        run: packaging/container-smoke.sh benchy-mcp:linux-${{ matrix.arch }}
      - name: Keep the tested image for publication
        run: |
          mkdir images
          docker save benchy-mcp:linux-${{ matrix.arch }} | gzip > images/benchy-mcp-${{ matrix.arch }}.image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchy-container-${{ matrix.arch }}
          retention-days: 7
          path: images/*.image.tar.gz
          compression-level: 0
          if-no-files-found: error

  # Also exercise the Dockerfile's default source build, which users run with `docker build .`.
  container-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: docker buildx build --load --tag benchy-mcp:source .
      - run: packaging/container-smoke.sh benchy-mcp:source

  # Only this job can publish or sign. The release environment can optionally require reviewers.
  release:
    needs: [checks, compat, smoke, containers, container-source]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchy-mcp-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchy-compat
          path: dist
      - name: Put install.sh beside the bundles
        run: cp install.sh dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: benchy-container-*
          merge-multiple: true
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested images and the multi-platform tags
        id: image
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          for arch in amd64 arm64; do
            docker load --input "images/benchy-mcp-$arch.image.tar.gz"
            docker tag "benchy-mcp:linux-$arch" "$image:$version-$arch"
            docker push "$image:$version-$arch"
          done
          docker buildx imagetools create \
            --tag "$image:$version" --tag "$image:${version%.*}" --tag "$image:latest" \
            "$image:$version-amd64" "$image:$version-arm64"
          digest=$(docker buildx imagetools inspect "$image:$version" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      # A signed statement, kept by GitHub, that each file was built by this workflow from this
      # commit: `gh attestation verify <file> --repo <owner>/benchy-mcp` checks it (README).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh
            dist/compat.json
            dist/*.cdx.json
      # Each bundle's SBOM, attested of that bundle: `gh attestation verify <bundle> --repo
      # <owner>/benchy-mcp --predicate-type https://cyclonedx.org/bom` (README). actions/attest, as
      # actions/attest-sbom is deprecated and now only wraps it. One step a bundle: an SBOM
      # attestation takes one SBOM, and each bundle's crates and library are its platform's.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/benchy-mcp-linux-x86_64.tar.gz
          sbom-path: dist/benchy-mcp-linux-x86_64.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/benchy-mcp-linux-aarch64.tar.gz
          sbom-path: dist/benchy-mcp-linux-aarch64.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/benchy-mcp-macos-arm64.tar.gz
          sbom-path: dist/benchy-mcp-macos-arm64.cdx.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/benchy-mcp-macos-x86_64.tar.gz
          sbom-path: dist/benchy-mcp-macos-x86_64.cdx.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && cat ./*.tar.gz.sha256 > SHA256SUMS &&
            sha256sum install.sh compat.json benchy-mcp-*.cdx.json >> SHA256SUMS)
          # The release notes are this version's section of CHANGELOG.md.
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "benchy-mcp ${GITHUB_REF_NAME#v}" --notes-file notes.md
