# cargo-mutants, as CI runs it (.github/workflows/mutants.yml): `cargo mutants` with no options
# mutates what the containment rests on, under the release profile the tests use.
#
# The gate is zero unexplained survivors. A mutant that no test can tell apart from the original
# is listed below with the measurement that says why, so a new survivor is always news. Exclude
# by function and change, never by line number, which goes stale with the next edit to the file.
#
# What Linux never compiles cannot be mutated usefully here, since the mutants run on Linux. The
# sandbox's off-Linux functions are in a file of their own, src/sandbox/elsewhere.rs, which the
# globs below leave out. (Skipping them where they stand would need a regex naming a line, since
# they share their Linux twins' names; or the `mutants` crate as a dependency; or
# `#[cfg_attr(any(), mutants::skip)]`, which cargo-mutants 27.1.0 ignores: it cannot parse
# `any()` there.)

examine_globs = [
    "src/guard.rs",
    "src/lockdown.rs",
    "src/sandbox.rs",
    "src/admission.rs",
    "src/loader.rs",
]

additional_cargo_args = ["--release"]

exclude_re = [
    # Equivalent: for disjoint bits `a ^ b` is `a | b`. In `engine_ruleset` the three removal
    # rights are single, distinct bits (this was `restrict_to` until the ruleset was built apart
    # from applying it); in `staging_rights`, `Truncate` came in ABI 3 and is not among the
    # rights `from_all(ABI::V1)` names.
    'src/sandbox\.rs:\d+:\d+: replace \| with \^ in (engine_ruleset|staging_rights)$',

    # Equivalent: `elapsed() < grace` and `<= grace` differ only if the clock reads exactly
    # `grace` when sampled, and then for one 20 ms poll.
    'src/sandbox\.rs:\d+:\d+: replace < with <= in alone_by$',

    # Message-only and unreachable: the name feeds a refusal's wording, never the allowlist
    # (`is_allowed` reads the type), and under the lock no SQL reaches the classifier as these
    # kinds. Measured on DuckDB 1.5.5: ANALYZE is typed VACUUM, SET VARIABLE is typed SET and
    # COPY FROM DATABASE is typed TRANSACTION; COPY, EXPORT and EXECUTE never bind; RELATION
    # and LOGICAL_PLAN come only from the C API's relation objects; and no statement tried was
    # typed MULTI, CREATE_FUNC or EXTENSION (CREATE FUNCTION is typed CREATE).
    # REQ-2 `each_statement_kind_is_named_as_duckdb_types_it` pins these typings, so a DuckDB that
    # changes one fails there first, and this line is revisited then.
    'src/guard\.rs:\d+:\d+: delete match arm ffi::duckdb_statement_type_DUCKDB_STATEMENT_TYPE_(COPY|EXPORT|EXECUTE|ANALYZE|MULTI|RELATION|LOGICAL_PLAN|CREATE_FUNC|VARIABLE_SET|EXTENSION|COPY_DATABASE) in type_name$',
]
